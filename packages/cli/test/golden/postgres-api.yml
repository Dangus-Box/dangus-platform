service: exemplo-postgres-api
secrets_path: /dangus/.kamal/secrets
image: dangus-box/exemplo-postgres-api
servers:
  web:
    hosts:
      - devbox-1
    options:
      memory: 512m
registry:
  server: ghcr.io
  username: "<%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>"
  password:
    - KAMAL_REGISTRY_PASSWORD
proxy:
  ssl: true
  host: api-postgres.exemplo.com
  app_port: 3000
  healthcheck:
    path: /ready
  run:
    options:
      label:
        - product=platform
        - app=proxy
builder:
  arch: amd64
  dockerfile: apps/api/Dockerfile
  context: "."
deploy_timeout: 120
labels:
  product: exemplo-postgres
  app: api
env:
  secret:
    - DATABASE_URL
accessories:
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    host: devbox-1
    labels:
      product: exemplo-postgres
      app: postgres
    env:
      clear:
        POSTGRES_USER: produto
        POSTGRES_DB: produto
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - exemplo-postgres-postgres:/var/lib/postgresql/data