service: exemplo-sqlite-web
secrets_path: /dangus/.kamal/secrets
image: dangus-box/exemplo-sqlite-web
servers:
  web:
    hosts:
      - devbox-1
    options:
      memory: 512m
registry:
  server: ghcr.io
  username: "<%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>"
  password:
    - KAMAL_REGISTRY_PASSWORD
proxy:
  ssl: true
  host: web-sqlite.exemplo.com
  app_port: 3000
  healthcheck:
    path: /
  run:
    bind_ips:
      - 179.198.100.144
      - 2a02:4780:c6:bdc::1
    options:
      label:
        - product=platform
        - app=proxy
builder:
  arch: amd64
  dockerfile: apps/web/Dockerfile
  context: "."
deploy_timeout: 120
labels:
  product: exemplo-sqlite
  app: web
env:
  secret: []