name: Restore Verification
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install age and BWS
        run: |
          sudo apt-get update && sudo apt-get install -y age
          curl -fsSLo /tmp/bws.zip https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo 'ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/bws.zip' | sha256sum -c -
          unzip -q /tmp/bws.zip -d /tmp/bws-bin
          echo /tmp/bws-bin >> "$GITHUB_PATH"
      - name: Prepare disposable Postgres 18
        run: docker pull postgres:18.1@sha256:1090bc3a8ccfb0b55f78a494d76f8d603434f7e4553543d6e807bc7bd6bbd17f
      - name: Verify Backup
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: bun run dangus db restore --verify
