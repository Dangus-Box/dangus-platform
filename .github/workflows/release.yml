name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run check:packages
      - name: Check versioning
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo 'Run changeset version and merge the changes before publishing.' >&2
            exit 1
          fi
      - name: Install BWS
        run: |
          curl --fail --location --silent --show-error -o /tmp/bws.zip https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo 'ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/bws.zip' | sha256sum --check
          unzip -q /tmp/bws.zip -d /tmp/bws-bin
          echo /tmp/bws-bin >> "$GITHUB_PATH"
      - name: Fetch npm token from BWS and publish
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
        run: |
          set -euo pipefail
          project_id=$(bws project list -o json | jq -er '[.[] | select(.name == "ops") | .id] | if length == 1 then .[0] else error("ops project missing or duplicated") end')
          secret_id=$(bws secret list "$project_id" -o json | jq -er '[.[] | select(.key == "platform__NPM_TOKEN") | .id] | if length == 1 then .[0] else error("npm token missing or duplicated") end')
          token=$(bws secret get "$secret_id" -o json | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$token"
          unset BWS_ACCESS_TOKEN
          export NODE_AUTH_TOKEN="$token"
          bunx changeset publish
