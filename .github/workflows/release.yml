name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run check:packages
      - name: Check versioning
        id: versioning
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            jq -e '.mode == "pre"' .changeset/pre.json > /dev/null
            for changeset in .changeset/*.md; do
              [ -f "$changeset" ] || continue
              [ "${changeset##*/}" = README.md ] && continue
              id=${changeset##*/}
              id=${id%.md}
              if ! jq -e --arg id "$id" '.changesets | index($id) != null' .changeset/pre.json > /dev/null; then
                echo 'Run changeset version and merge the changes before publishing.' >&2
                exit 1
              fi
            done
            echo 'dist-tag=next' >> "$GITHUB_OUTPUT"
          elif find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo 'Run changeset version and merge the changes before publishing.' >&2
            exit 1
          else
            prerelease=$(jq -rs '[.[] | select(.private != true and (.version | contains("-"))) | .name] | join(" ")' packages/*/package.json)
            if [ -n "$prerelease" ]; then
              echo "Prerelease versions publish only in pre mode, under next: $prerelease" >&2
              exit 1
            fi
            echo 'dist-tag=latest' >> "$GITHUB_OUTPUT"
          fi
      - name: Install BWS
        run: |
          curl --fail --location --silent --show-error -o /tmp/bws.zip https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          echo 'ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  /tmp/bws.zip' | sha256sum --check
          unzip -q /tmp/bws.zip -d /tmp/bws-bin
          echo /tmp/bws-bin >> "$GITHUB_PATH"
      - name: Fetch npm token from BWS and publish
        env:
          NPM_DIST_TAG: ${{ steps.versioning.outputs.dist-tag }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_SERVER_URL: ${{ vars.BWS_SERVER_URL }}
        run: |
          set -euo pipefail
          project_id=$(bws project list -o json | jq -er '[.[] | select(.name == "ops") | .id] | if length == 1 then .[0] else error("ops project missing or duplicated") end')
          secret_id=$(bws secret list "$project_id" -o json | jq -er '[.[] | select(.key == "platform__NPM_TOKEN") | .id] | if length == 1 then .[0] else error("npm token missing or duplicated") end')
          token=$(bws secret get "$secret_id" -o json | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$token"
          unset BWS_ACCESS_TOKEN
          export NODE_AUTH_TOKEN="$token"
          if [ "$NPM_DIST_TAG" = next ]; then
            # Changesets rejects --tag in pre mode. Exit only in this disposable checkout;
            # package versions stay prereleases and the explicit tag protects latest.
            bunx changeset pre exit
            bunx changeset publish --tag next
          elif [ "$NPM_DIST_TAG" = latest ]; then
            bunx changeset publish
          else
            echo 'Unexpected npm dist-tag.' >&2
            exit 1
          fi
