service: dangus-ops
image: dangus-ops
servers:
  web:
    hosts:
      - devbox-1
# Sem imagem própria: registry local para o Kamal não fazer login no Host.
registry:
  server: localhost:5555
secrets_path: .kamal/secrets
# O Umami leva ~33 s para ficar pronto com 0,2 vCPU; o padrão é 30 s.
deploy_timeout: 120
builder:
  arch: amd64
accessories:
  grafana:
    image: grafana/grafana:11.6.3@sha256:6128afd8174f01e39a78341cb457588f723bbb9c3b25c4d43c4b775881767069
    host: devbox-1
    port: 127.0.0.1:3300:3000
    env:
      secret:
        - GF_SECURITY_ADMIN_PASSWORD
    files:
      - provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - dashboards/stack-ops.json:/etc/grafana/dashboards/stack-ops.json
    volumes:
      - dangus-ops-grafana:/var/lib/grafana
    options:
      memory: 512m
      cpus: 0.2
  loki:
    image: grafana/loki:3.4.3@sha256:5fe9fa99e9a747297cdf0239a5b25d192d8f668bd6505b09beef4dffcab5aac2
    host: devbox-1
    cmd: -config.file=/etc/loki/config.yml
    files:
      - loki.yml:/etc/loki/config.yml
    volumes:
      - dangus-ops-loki:/loki
    options:
      memory: 768m
      cpus: 0.3
  prometheus:
    image: prom/prometheus:v3.3.1@sha256:e2b8aa62b64855956e3ec1e18b4f9387fb6203174a4471936f4662f437f04405
    host: devbox-1
    cmd: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d --web.enable-remote-write-receiver
    files:
      - prometheus.yml:/etc/prometheus/prometheus.yml
    volumes:
      - dangus-ops-prometheus:/prometheus
    options:
      memory: 896m
      cpus: 0.4
  umami-db:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    host: devbox-1
    env:
      clear:
        POSTGRES_DB: umami
        POSTGRES_USER: umami
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - dangus-ops-umami-db:/var/lib/postgresql/data
    options:
      memory: 256m
      cpus: 0.1
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0@sha256:77264ce6951c6b131a91d99f1cfd720d9efac1eaaa12e104f21cf49408dd77e0
    host: devbox-1
    proxy:
      host: analytics.dangus-box.com
      app_port: 3000
      ssl: true
      healthcheck:
        path: /api/heartbeat
    env:
      clear:
        TRACKER_SCRIPT_NAME: t.js
        COLLECT_API_ENDPOINT: /api/e
      secret:
        - DATABASE_URL
        - APP_SECRET
    options:
      memory: 512m
      cpus: 0.2
