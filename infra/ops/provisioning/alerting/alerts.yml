apiVersion: 1
groups:
  - orgId: 1
    name: Host
    folder: Stack Ops
    interval: 1m
    rules:
      - uid: host-disco
        title: Disco do Host acima de 85%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Disco raiz do Host acima de 85%.
contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "__TELEGRAM_CHAT_ID__"
policies:
  - orgId: 1
    receiver: Telegram
    group_by: [grafana_folder, alertname]
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
